<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuachoYork Minecraft Server</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Trebuchet MS', Arial, sans-serif;
      text-align: center;
      padding: 40px 15px;
      background: radial-gradient(circle, #1a261a 0%, #0a0d0a 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(20, 28, 20, 0.95);
      padding: 30px 20px;
      border-radius: 20px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 0 25px rgba(85, 255, 85, 0.2), inset 0 0 2px #55ff55;
      border: 2px solid #2e4d2e;
    }
    .badge {
      display: inline-block;
      background: #1e3a1e;
      color: #55ff55;
      padding: 5px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #55ff55;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .icon {
      width: 90px;
      height: 90px;
      margin-bottom: 10px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
    }
    h2 {
      color: #55ff55;
      font-size: 26px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      margin-bottom: 8px;
    }
    p {
      color: #b0c4b0;
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 20px;
    }
    .info-box {
      background: #0f170f;
      border: 1px dashed #3e6b3e;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 15px;
      color: #e0eee0;
    }
    .btn-main {
      display: block;
      background: linear-gradient(180deg, #55ff55 0%, #2e7d32 100%);
      color: #000;
      padding: 15px;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(85, 255, 85, 0.4);
      margin-bottom: 12px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.4);
    }
    .btn-copy {
      background: #2a3d2a;
      color: #a3e6a3;
      border: 1px solid #3e6b3e;
      padding: 10px;
      width: 100%;
      border-radius: 8px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="badge">● Servidor Activo 24/7</span>
    <br>
    <img class="icon" src="https://assets.fandom.com/images/a/a3/Grass_Block_JE7_BE6.png" alt="Minecraft Grass Block">
    <h2>HuachoYork MC</h2>
    <p>Servidor oficial de Minecraft Bedrock. Toca el botón para conectar instantáneamente.</p>

    <div class="info-box">
      <strong>IP:</strong> 147.185.221.213<br>
      <strong>Puerto:</strong> 40456
    </div>

    <a class="btn-main" href="minecraft://?addExternalServer=HuachoYork|147.185.221.213:40456">
      🎮 Entrar a Minecraft
    </a>

    <button class="btn-copy" onclick="navigator.clipboard.writeText('147.185.221.213:40456'); alert('IP y Puerto copiados');">
      📋 Copiar IP y Puerto
    </button>
  </div>

</body>
</html>
